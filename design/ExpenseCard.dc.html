<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" style="display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease" style-active="transform:scale(.985)">
<dc-import name="Avatar" who="{{ payerName }}" hue="{{ hue }}" size="md" hint-size="40px,40px"></dc-import>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<div style="font-size:15px;font-weight:700;color:var(--ink);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ desc }}</div>
<div style="font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ payerLine }}</div>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none">
<div style="font-size:16px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-0.01em">{{ amountFmt }}</div>
<sc-if value="{{ owes }}" hint-placeholder-val="{{ true }}"><div style="font-size:12px;font-weight:700;color:var(--neg);white-space:nowrap">sua parte: {{ shareFmt }}</div></sc-if>
<sc-if value="{{ lent }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;font-weight:700;color:var(--pos);white-space:nowrap">+ {{ lentFmt }}</div></sc-if>
<sc-if value="{{ out }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap">você tá fora</div></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:90},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Airbnb na Lagoa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;payerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ana Clara&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;payerShort&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ana&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hue&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:30,&quot;min&quot;:0,&quot;max&quot;:360,&quot;tsType&quot;:&quot;number&quot;},&quot;amount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:184000,&quot;tsType&quot;:&quot;number&quot;},&quot;myShare&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:46000,&quot;tsType&quot;:&quot;number&quot;},&quot;iPaid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12 set&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = c => 'R$ ' + (Math.abs(c || 0) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const amt = Number(p.amount) || 0, share = Number(p.myShare) || 0, iPaid = !!p.iPaid;
    return {
      desc: p.desc ?? 'Mercado', payerName: p.payerName ?? 'Ana Clara', hue: p.hue ?? 30,
      payerLine: `${p.payerShort ?? 'Ana'} pagou · ${p.date ?? '12 set'}`,
      amountFmt: f(amt), shareFmt: f(share), lentFmt: f(amt - share),
      owes: !iPaid && share > 0, lent: iPaid && amt - share > 0, out: !iPaid && share === 0,
      onClick: p.onClick
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" style="{{ box }}">{{ initials }}<sc-if value="{{ selected }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--brand);color:var(--onBrand);display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;who&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ana Clara&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hue&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:30,&quot;min&quot;:0,&quot;max&quot;:360,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;,&quot;xl&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'sm'|'md'|'lg'|'xl'&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const sz = { sm: 28, md: 40, lg: 52, xl: 88 }[p.size] || 40;
    const w = String(p.who || '?').trim().split(/\s+/);
    const ini = (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase();
    const h = p.hue ?? 170;
    return {
      initials: ini, selected: !!p.selected, onClick: p.onClick,
      box: { position: 'relative', width: sz, height: sz, borderRadius: '50%', background: `oklch(0.83 0.1 ${h})`, color: '#132220', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: Math.round(sz * 0.36), letterSpacing: '-0.02em', flex: 'none', cursor: p.onClick ? 'pointer' : 'default', boxShadow: p.selected ? '0 0 0 2.5px var(--surface), 0 0 0 5px var(--brand)' : '0 0 0 2px var(--surface)', transition: 'box-shadow .15s ease', userSelect: 'none' }
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ active }}" hint-placeholder-val="{{ false }}"><button onClick="{{ onClick }}" style="height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--brand);background:var(--brand);color:var(--onBrand);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none;transition:all .15s ease">{{ label }}</button></sc-if>
<sc-if value="{{ inactive }}" hint-placeholder-val="{{ true }}"><button onClick="{{ onClick }}" style="height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none;transition:all .15s ease" style-hover="border-color:var(--brand)">{{ label }}</button></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:60},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Igual&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { label: this.props.label ?? 'Igual', active: !!this.props.active, inactive: !this.props.active, onClick: this.props.onClick };
  }
}
</script>
</body>
</html>
